name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    # o CI aplica as migrations num banco vazio, que e a unica forma de provar que elas
    # sobem um ambiente novo sem passo manual
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: challenge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # fetch-depth 0 porque o commitlint precisa do historico para comparar base e head
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # corepack le o campo packageManager, entao a versao do pnpm aqui e a mesma da maquina
      - name: Habilita o pnpm
        run: corepack enable

      - name: Localiza o store do pnpm
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Instala as dependencias
        run: pnpm install --frozen-lockfile

      - name: Aplica as migrations num banco vazio
        run: pnpm --filter @challenge/transactions run prisma:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/challenge?schema=public

      - name: Roda o quality gate
        run: pnpm quality

      # o hook local se contorna com --no-verify; aqui nao
      - name: Valida as mensagens dos commits do PR
        if: github.event_name == 'pull_request'
        run: >
          pnpm commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
